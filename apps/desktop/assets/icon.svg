<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>

  <!-- Radar circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Glowing Emblem -->
  <rect x="136" y="136" width="240" height="240" rx="60" fill="url(#coreGrad)" filter="url(#glow)"/>

  <!-- Sensor Waves -->
  <path d="M216 170 A 55 55 0 0 1 296 170" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <path d="M232 186 A 32 32 0 0 1 280 186" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.75"/>

  <!-- Car Symbol -->
  <path d="M312 240 L300 210 C296 202 288 196 280 196 L232 196 C224 196 216 202 212 210 L200 240 C188 244 180 254 180 268 L180 312 C180 318 184 322 190 322 L200 322 C206 322 210 318 210 312 L210 302 L302 302 L302 312 C302 318 306 322 312 322 L322 322 C328 322 332 318 332 312 L332 268 C332 254 324 244 312 240 Z M216 276 C208 276 202 270 202 262 C202 254 208 248 216 248 C224 248 230 254 230 262 C230 270 224 276 216 276 Z M296 276 C288 276 282 270 282 262 C282 254 288 248 296 248 C304 248 310 254 310 262 C310 270 304 276 296 276 Z M208 232 L218 212 L294 212 L304 232 Z" fill="#ffffff"/>
</svg>
